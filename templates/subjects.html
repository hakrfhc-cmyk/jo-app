    <style>
        body { font-family: 'Cairo', Tahoma, sans-serif; background-color: #f4f7f6; margin: 0; padding: 20px; }
        .container { max-width: 950px; margin: 0 auto; background: #ffffff; padding: 30px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h1 { color: #1a5276; text-align: center; margin-bottom: 5px; }
        .subtitle { color: #7f8c8d; text-align: center; margin-bottom: 30px; }
        .grade-section { background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 8px; padding: 20px; margin-bottom: 20px; }
        .grade-title { color: #2980b9; border-bottom: 2px solid #3498db; padding-bottom: 8px; margin-top: 0; font-size: 20px; }
        .field-tag { display: inline-block; background: #e67e22; color: white; font-size: 12px; padding: 3px 8px; border-radius: 4px; margin-bottom: 10px; }
        .subjects-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 10px; }
        .subject-item { background: #ffffff; border: 1px solid #dcdde1; padding: 10px 15px; border-radius: 6px; display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: bold; color: #333; }
        .btn-open { background: #3498db; color: white; border: none; padding: 5px 10px; border-radius: 4px; cursor: pointer; font-size: 12px; text-decoration: none; }
        .btn-open:hover { background: #2980b9; }
        .back-link { display: inline-block; margin-top: 20px; color: #3498db; text-decoration: none; font-weight: bold; }
    </style>
</head>

        allCurriculum.forEach(item => {
            let section = document.createElement('div');

            let subjectsHtml = '';
            item.subjects.forEach(sub => {
                subjectsHtml += `
                    <div class="subject-item">
                        <span>📚 ${sub}</span>

            });

            section.innerHTML = `
                <span class="field-tag">${item.type}</span>
                <h2 class="grade-title">${item.grade}</h2>
                <div class="subjects-grid">
                    ${subjectsHtml}
                </div>

            container.appendChild(section);
        });

</body>
